name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and smoke test (Arch Linux, VLC 3 + Qt 6)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf \
            vlc libvlc vlc-plugins-all \
            qt6-base qt6-declarative qt6-svg \
            ffmpeg ttf-dejavu imagemagick
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
          test -f build/libneo_plugin.so
      # VLC refuses to run as root, and the container runs as root.
      - name: Create test user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Plugin is loadable by VLC
        run: |
          su tester -c "VLC_PLUGIN_PATH='$GITHUB_WORKSPACE/build' vlc --no-plugins-cache --list 2>/dev/null" | tee /tmp/modules.txt | grep -E '^\s+neo\s'
      - name: Smoke test (headless, real VLC core)
        run: su tester -c "cd '$GITHUB_WORKSPACE' && TMPDIR=/tmp scripts/smoke-test.sh"

  mint-22-package-base:
    name: Linux Mint 22 package-base compatibility (Ubuntu 24.04 runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the distribution Qt and VLC packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            vlc libvlc-dev libvlccore-dev ffmpeg
          dpkg-query -W -f='${Version}' qt6-base-dev > /tmp/system-qt-before
      - name: Install VLC Neo (Qt is provisioned under the runner user's home)
        run: scripts/install.sh --default --yes
      - name: Verify install and keep the distribution Qt unchanged
        run: |
          test -x "$HOME/.local/bin/vlc-neo"
          test -f "$HOME/.local/lib/vlc-neo/plugins/gui/libneo_plugin.so"
          test "$(dpkg-query -W -f='${Version}' qt6-base-dev)" = "$(cat /tmp/system-qt-before)"
          "$HOME/.local/bin/vlc-neo" --version
      - name: Smoke test playback, UI captures and persisted settings
        run: |
          export NEO_QT_ROOT="$HOME/Qt/6.8.3/gcc_64"
          ctest --test-dir build --output-on-failure
          scripts/smoke-test.sh
      - name: Uninstall and verify system Qt remains unchanged
        if: always()
        run: |
          scripts/install.sh --uninstall
          test ! -e "$HOME/.local/bin/vlc-neo"
          test ! -e "$HOME/.local/bin/vlc"
          test ! -e "$HOME/.local/lib/vlc-neo/plugins/gui/libneo_plugin.so"
          test "$(dpkg-query -W -f='${Version}' qt6-base-dev)" = "$(cat /tmp/system-qt-before)"
