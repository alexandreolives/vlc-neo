name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and smoke test (Arch Linux, VLC 3 + Qt 6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja pkgconf \
            vlc libvlc vlc-plugins-all \
            qt6-base qt6-declarative qt6-svg \
            ffmpeg ttf-dejavu imagemagick
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          test -f build/libneo_plugin.so
      # VLC refuses to run as root, and the container runs as root.
      - name: Create test user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Plugin is loadable by VLC
        run: |
          su tester -c "VLC_PLUGIN_PATH='$GITHUB_WORKSPACE/build' vlc --no-plugins-cache --list 2>/dev/null" | tee /tmp/modules.txt | grep -E '^\s+neo\s'
      - name: Smoke test (headless, real VLC core)
        run: su tester -c "cd '$GITHUB_WORKSPACE' && TMPDIR=/tmp scripts/smoke-test.sh"
